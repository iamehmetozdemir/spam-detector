name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Node runs the browser demo's model code (docs/spam-model.js) in the parity test
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      # emails.csv is not in the repo, so the data tests are skipped here
      - run: pytest -v
